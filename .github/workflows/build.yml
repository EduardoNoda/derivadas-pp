name: build-msvc

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar (baixa a SFML 3.0.0)
        run: cmake -S . -B build -DSFML_FETCH=ON
      - name: Compilar
        run: cmake --build build --config Release
      - name: Testes do nucleo
        run: ctest --test-dir build -C Release --output-on-failure
